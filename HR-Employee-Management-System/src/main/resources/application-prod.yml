spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hr_management_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000
      pool-name: HRManagementProdHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
hr:
  scheduler:
   employee-report-delay: 300000	
